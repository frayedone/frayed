name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # No android-actions/setup-ndk exists; sdkmanager installs the exact pinned NDK.
      - name: Install SDK platform, build-tools and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_ROOT=${SDK_DIR}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --version 1.5.0 --locked

      - name: Prepare self-signing keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=frayed" -validity 10000 -keyalg RSA -keysize 2048
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Resolve version and tag
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="0.1.0"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: cargo apk2 build -p frayed-app --lib --release --target aarch64-linux-android

      - name: Rename APK for in-app updater
        run: |
          APK=$(find target -type f -name 'frayed.apk' -print -quit)
          test -n "$APK" || { echo "APK not found" >&2; exit 1; }
          cp "$APK" "frayed-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: frayed-${{ steps.ver.outputs.version }}.apk
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
